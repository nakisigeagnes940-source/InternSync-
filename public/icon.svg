<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Logbook spine and cover subtle shadow -->
  <rect x="96" y="80" width="320" height="352" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="6" />
  <!-- Logbook binding lines -->
  <line x1="140" y1="80" x2="140" y2="432" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10,10" opacity="0.4" />
  <!-- Checkmark icon -->
  <path d="M180 256 L240 316 L340 196" fill="none" stroke="url(#checkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Horizontal document lines -->
  <line x1="180" y1="360" x2="330" y2="360" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity="0.7" />
  <line x1="180" y1="390" x2="280" y2="390" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity="0.5" />
</svg>
